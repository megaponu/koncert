<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>player</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body { font-family: Arial, sans-serif; font-size: 13px; background: #000; color: #222; }

/* ---------- сцена ---------- */
#stage { position: fixed; inset: 0; background: #000; overflow: hidden; cursor: pointer; }
#screen {
  position: absolute; inset: 0;
  background: #000;
}
#mediaEl {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  display: none;
  opacity: 1;
}
#mediaEl.loaded { display: block; }

/* Эффект плавного затухания СТРОГО при добавлении класса в конце */
#mediaEl.faded-out {
  opacity: 0;
  transition: opacity 1.5s ease-in-out;
}

/* ---------- скрытие интерфейса (ручной H / кнопка ◡) ---------- */
body.ui-hidden #queueToggle,
body.ui-hidden #transport { display: none; }
body.ui-hidden #uiShow {
  position: fixed; bottom: 12px; right: 12px; z-index: 8;
  width: 28px; height: 28px;
  background: #222; color: #aaa; border: none;
  font-family: inherit; font-size: 13px; line-height: 1;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  opacity: 0.5;
}
body.ui-hidden #uiShow:hover { opacity: 1; color: #fff; }
#uiShow { display: none; }

/* ---------- режим зрителя: весь интерфейс плеера скрыт всегда ---------- */
body.guest-mode #queueToggle,
body.guest-mode #transport,
body.guest-mode #uiShow,
body.guest-mode #queuePanel,
body.guest-mode #queueOverlay { display: none !important; }

/* у ведущего кнопка разблокировки не нужна */
body:not(.guest-mode) #hostUnlock,
body:not(.guest-mode) #hostUnlockBox { display: none !important; }

/* ---------- незаметная кнопка входа для "главаря" ---------- */
#hostUnlock {
  position: fixed; bottom: 12px; left: 12px; z-index: 9;
  width: 26px; height: 26px;
  background: #222; color: #666; border: none;
  font-family: inherit; font-size: 12px; line-height: 1;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  opacity: 0.35;
}
#hostUnlock:hover { opacity: 0.9; color: #ccc; }
#hostUnlock:focus-visible { outline: 2px solid #2d7dd2; outline-offset: 2px; }

#hostUnlockBox {
  position: fixed; bottom: 12px; left: 44px; z-index: 9;
  display: none; align-items: center; gap: 6px;
}
#hostUnlockBox.open { display: flex; }
#hostPassInput {
  background: #111; border: 1px solid #333; color: #ddd;
  font-family: inherit; font-size: 12px; padding: 6px 8px;
  width: 130px; outline: none;
}
#hostPassInput:focus { border-color: #2d7dd2; }
#hostPassInput.err { border-color: #c0392b; animation: hpshake .3s; }
@keyframes hpshake {
  25% { transform: translateX(-3px); }
  75% { transform: translateX(3px); }
}

/* ---------- плейлист ---------- */
#queueToggle {
  position: fixed; top: 16px; left: 16px; z-index: 8;
  width: 32px; height: 32px;
  background: #222; color: #aaa; border: none;
  font-family: inherit; font-size: 14px; line-height: 1;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
#queueToggle:hover { color: #fff; }
#queueToggle:focus-visible { outline: 2px solid #2d7dd2; outline-offset: 2px; }
#queueToggle.hidden { display: none; }

#queueClose {
  background: none; border: 1px solid #ddd; color: #999;
  font-family: inherit; font-size: 12px; line-height: 1;
  width: 22px; height: 22px;
  cursor: pointer;
}
#queueClose:hover { color: #333; border-color: #bbb; }
#queueClose:focus-visible { outline: 2px solid #2d7dd2; outline-offset: 2px; }

#queueOverlay {
  position: fixed; inset: 0; z-index: 6;
  background: transparent;
  display: none;
}
#queueOverlay.open { display: block; }

#queuePanel {
  position: fixed; top: 0; bottom: 0; left: 0;
  width: 320px; z-index: 7;
  background: #fff;
  border-right: 1px solid #e5e5e5;
  transform: translateX(-100%);
  display: flex; flex-direction: column;
}
#queuePanel.open { transform: translateX(0); }
#queuePanel .qhead {
  padding: 14px 16px; border-bottom: 2px solid #f0f0f0;
  font-size: 13px; font-weight: bold; color: #111;
  display: flex; align-items: center; justify-content: space-between;
}
#queuePanel .qhead span.count { font-size: 11px; color: #bbb; font-weight: normal; }
#queueList { overflow-y: auto; flex: 1; }
.qrow {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px;
  border-bottom: 1px solid #f0f0f0;
  cursor: pointer;
}
.qrow:hover { background: #f5f9ff; }
.qrow:focus-visible { outline: 2px solid #2d7dd2; outline-offset: -2px; }
.qrow.active { background: #f5f9ff; border-left: 3px solid #2d7dd2; padding-left: 13px; }
.qrow .n { font-size: 11px; color: #ccc; width: 18px; }
.qrow.active .n { color: #2d7dd2; }
.qrow .meta { min-width: 0; }
.qrow .t { font-size: 13px; font-weight: bold; color: #222; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- нижняя панель управления ---------- */
#transport {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  height: 48px; background: #222;
  display: flex; align-items: center;
  padding: 0 16px; gap: 16px;
}
.tbtn {
  background: none; border: 1px solid #444; color: #aaa;
  font-family: inherit; font-size: 12px;
  padding: 5px 10px; cursor: pointer;
}
.tbtn:hover { color: #fff; border-color: #666; }
.tbtn:focus-visible { outline: 2px solid #2d7dd2; outline-offset: 2px; }
.tbtn.play { color: #fff; border-color: #888; background: #333; min-width: 48px; text-align: center; }
.tbtn.play:hover { background: #3a3a3a; }
#nowPlaying { min-width: 0; }
#nowPlaying .t { font-size: 13px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#seek {
  flex: 1; height: 4px; background: #444;
  position: relative; cursor: pointer;
}
#seekFill { position: absolute; left: 0; top: 0; bottom: 0; background: #2d7dd2; width: 0%; }
#timecode { font-size: 11px; color: #888; white-space: nowrap; }
#timecode .cur { color: #ddd; }

#volWrap { display: flex; align-items: center; gap: 6px; }
#volSlider { width: 70px; accent-color: #2d7dd2; cursor: pointer; }

@media (max-width: 640px) {
  #queuePanel { width: 100%; }
  #transport { flex-wrap: wrap; height: auto; padding: 8px 12px; gap: 8px 12px; }
  #seek { order: 4; width: 100%; }
}
</style>
</head>
<body class="guest-mode">

<div id="stage">
  <div id="screen"></div>
  <video id="mediaEl" playsinline></video>
</div>

<button id="queueToggle" aria-label="плейлист">☰</button>
<div id="queueOverlay"></div>
<div id="queuePanel">
  <div class="qhead">
    <span>плейлист <span class="count" id="qCount"></span></span>
    <button id="queueClose" aria-label="закрыть">✕</button>
  </div>
  <div id="queueList"></div>
</div>

<div id="transport">
  <button class="tbtn" id="prevBtn">◀◀</button>
  <button class="tbtn play" id="playBtn">▶</button>
  <button class="tbtn" id="nextBtn">▶▶</button>
  <div id="nowPlaying">
    <div class="t" id="npTitle">—</div>
  </div>
  <div id="seek"><div id="seekFill"></div></div>
  <div id="timecode"><span class="cur" id="tCur">00:00</span> / <span id="tTot">00:00</span></div>
  <div id="volWrap">
    <span>🔊</span>
    <input type="range" id="volSlider" min="0" max="1" step="0.01" value="1">
  </div>
  <button class="tbtn" id="localMuteBtn" title="беззвучно только у тебя — у зрителей звук не меняется">🔈</button>
  <button class="tbtn" id="hideBtn" title="скрыть интерфейс">◡</button>
</div>
<button id="uiShow" aria-label="показать интерфейс">◠</button>

<!-- незаметная кнопка входа для зрителей -->
<button id="hostUnlock" aria-label="вход">⚿</button>
<div id="hostUnlockBox">
  <input type="password" id="hostPassInput" placeholder="пароль" autocomplete="off">
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import {
  getDatabase, ref, onValue, update, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-database.js";
import {
  getAuth, signInWithEmailAndPassword, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDOCVqJ45mFqSfc3IOJ3pvXtFKUtpq311E",
  authDomain: "koncert-f2c3a.firebaseapp.com",
  databaseURL: "https://koncert-f2c3a-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "koncert-f2c3a",
  storageBucket: "koncert-f2c3a.firebasestorage.app",
  messagingSenderId: "513334037791",
  appId: "1:513334037791:web:b9c1c3a4bcf68e7419342a"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

// Технический логин Firebase Auth — пользователь его не видит и не вводит,
// вводится только пароль в маленькое поле в углу.
const HOST_EMAIL = "host@koncert.local";

const stateRef = ref(db, "room/state");

// поправка на разницу между часами клиента и сервера Firebase
let serverOffset = 0;
onValue(ref(db, ".info/serverTimeOffset"), snap => {
  serverOffset = snap.val() || 0;
});
function nowServer() { return Date.now() + serverOffset; }
  
const tracks = [
  { title: "лукашенко взлетает на вертолёт", src: encodeURI("video/pidor.mp4") },
  { title: "петушок великий", src: encodeURI("video/petyx(nastoyachi).mp4") },
  { title: "эплпапеплапалп", src: encodeURI("video/lv_0_20260802030641.mp4") },
  { title: "владик майкрфт", src: encodeURI("video/vladik_minecraft.mp4") },
  { title: "голубой голубой", src: "https://cdn.discordapp.com/attachments/1466432455798948132/1541103811735720096/lv_0_20260823201249.mp4?ex=6a8c6045&is=6a8b0ec5&hm=142d7d4a96e2fa1394607e1c33e40cf5b20accde84bc262662140e2420acaa31&" },
  { title: "ягегейгй", src: encodeURI("video/yageygeygey.mp4") },
  { title: "ча ча ча", src: encodeURI("video/chachacha.mp4") },
  { title: "это непросто член", src: encodeURI("video/eto_neprost.mp4") },
  { title: "неебу лягушка", src: "https://cdn.discordapp.com/attachments/1466432455798948132/1541099629528088576/lv_0_20260819195618.mp4?ex=6a8c5c5f&is=6a8b0adf&hm=7b73777e2d7f9b86750c61733bfab9b329b0837f2ad420f3d94b7c0a16fe5f4c&" },
  { title: "неебу шоето бля", src: "https://cdn.discordapp.com/attachments/1466432455798948132/1541099619532935258/lv_0_20250830173827.mp4?ex=6a8c5c5d&is=6a8b0add&hm=49ed9893ce9d1fc62ee90020fed25552b1fb8167482add5d266023eeb6173220&" },
  { title: "эферест", src: "https://cdn.discordapp.com/attachments/1466432455798948132/1541105406779199558/lv_0_20260823201853.mp4?ex=6a8c61c1&is=6a8b1041&hm=a32ec7ce119e083860b9ac16c41dd51df9d449b7db969d7c0c88ccf19445016f&" },
  { title: "голубой", src: "https://cdn.discordapp.com/attachments/1466432455798948132/1541103811735720096/lv_0_20260823201249.mp4?ex=6a8c6045&is=6a8b0ec5&hm=142d7d4a96e2fa1394607e1c33e40cf5b20accde84bc262662140e2420acaa31&" },
  { title: "маяхей", src: "https://cdn.discordapp.com/attachments/1466432455798948132/1541099622695706695/lv_0_20260823185340.mp4?ex=6a8c5c5e&is=6a8b0ade&hm=275384d374cb3b21bbba70e4457b2d3d9e27d9bbc805dd5dbce4f16e766a593b&" },
  { title: "кавер на 2017 песенка Hello", src: "https://cdn.discordapp.com/attachments/1466432455798948132/1541110894019350668/km.mp4?ex=6a8c66dd&is=6a8b155d&hm=be0aad2d62bde55286b4afba375c03110ded385335ee55b11fb426f3d96ef644&" },
  { title: "зомби сосёт", src: "https://cdn.discordapp.com/attachments/1466432455798948132/1541121578740359329/-_1080p_h264.mp4?ex=6a8c70d1&is=6a8b1f51&hm=3c81f2a7307c73d1c2306a773f599c65ec7eee768a3d7a38770455bf6ce73f10&" },
  { title: "ещё каокйт трек ты попросил", src: "https://cdn.discordapp.com/attachments/1466432455798948132/1541126257511628990/lv_0_20260823194629.mp4?ex=6a8c752c&is=6a8b23ac&hm=6b20448de68c0af85b95e8ea11c2966128204b732c1f447989182f78fa19e939&" }
];

let current = 0;
let fadeTimeoutId = null;
let isHost = false;
let hostIntendPlaying = false; // осознанно ли ведущий хочет, чтобы видео играло (не путать с mediaEl.paused)
let localVolume = 1;
let lastKnownState = null;
let initializedFromRemote = false;

const screen = document.getElementById('screen');
const npTitle = document.getElementById('npTitle');
const playBtn = document.getElementById('playBtn');
const seekFill = document.getElementById('seekFill');
const tCur = document.getElementById('tCur');
const tTot = document.getElementById('tTot');
const qCount = document.getElementById('qCount');
const queueList = document.getElementById('queueList');
const queuePanel = document.getElementById('queuePanel');
const queueToggle = document.getElementById('queueToggle');
const queueOverlay = document.getElementById('queueOverlay');
const mediaEl = document.getElementById('mediaEl');
const hostUnlockBtn = document.getElementById('hostUnlock');
const hostUnlockBox = document.getElementById('hostUnlockBox');
const hostPassInput = document.getElementById('hostPassInput');
const volSlider = document.getElementById('volSlider');
const localMuteBtn = document.getElementById('localMuteBtn');

qCount.textContent = tracks.length + ' шт.';

if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', () => { if (isHost) play(); });
  navigator.mediaSession.setActionHandler('pause', () => { if (isHost) pause(); });
}

function fmt(s){
  if(!isFinite(s) || s < 0) s = 0;
  const m=Math.floor(s/60), sec=Math.floor(s%60);
  return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}

function renderQueue(){
  queueList.innerHTML = tracks.map((t,i)=>`
    <div class="qrow${i===current?' active':''}" tabindex="0" data-i="${i}">
      <span class="n">${String(i+1).padStart(2,'0')}</span>
      <div class="meta">
        <div class="t">${t.title}</div>
      </div>
    </div>`).join('');
  queueList.querySelectorAll('.qrow').forEach(row=>{
    row.addEventListener('click', ()=>selectTrack(+row.dataset.i));
    row.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' ') selectTrack(+row.dataset.i); });
  });
}

function selectTrack(i){ current=i; loadTrack(); renderQueue(); play(); }

function resetFade() {
  clearTimeout(fadeTimeoutId);
  mediaEl.classList.remove('faded-out');
}

function loadTrack(){
  resetFade();
  const t = tracks[current];
  npTitle.textContent = t.title;
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: t.title });
  }
  seekFill.style.width = '0%';
  tCur.textContent = '00:00';
  tTot.textContent = '00:00';
  mediaEl.classList.remove('loaded');
  mediaEl.src = t.src;
  mediaEl.load();
}

function play(){ mediaEl.play().catch(()=>{}); hostIntendPlaying = true; }
function pause(){ mediaEl.pause(); hostIntendPlaying = false; }

mediaEl.addEventListener('loadedmetadata', ()=>{ tTot.textContent = fmt(mediaEl.duration); });
mediaEl.addEventListener('loadeddata', ()=>{ mediaEl.classList.add('loaded'); });
mediaEl.addEventListener('error', ()=>{ mediaEl.classList.remove('loaded'); });
mediaEl.addEventListener('timeupdate', ()=>{
  const pct = mediaEl.duration ? Math.min(1, mediaEl.currentTime/mediaEl.duration) : 0;
  seekFill.style.width = (pct*100)+'%';
  tCur.textContent = fmt(mediaEl.currentTime);
});

mediaEl.addEventListener('play', ()=>{
  resetFade();
  playBtn.textContent = '❚❚';
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
  if (isHost) writeState();
});
mediaEl.addEventListener('pause', ()=>{
  playBtn.textContent = '▶';
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
  if (mediaEl.ended) {
    // трек реально закончился — это не сворачивание окна и не ручная
    // пауза, дальше сам себя не перезапускаем
    hostIntendPlaying = false;
  }
  if (isHost) {
    if (hostIntendPlaying) {
      // это браузер сам остановил декодирование (например, при сворачивании
      // окна), а не осознанный конец/клик по паузе — тихо возобновляем и не
      // рвём трансляцию у зрителей
      mediaEl.play().catch(()=>{});
    } else {
      writeState();
    }
  }
});

// более настойчивая подстраховка: после автопаузы от сворачивания окна
// браузер иногда молча игнорирует одиночный повторный play() — поэтому
// продолжаем пробовать раз в секунду, пока он не пустит воспроизведение
// обратно. !mediaEl.ended — обязательно, иначе на реально закончившемся
// видео play() перематывает его на начало и получается "повтор"
setInterval(() => {
  if (isHost && hostIntendPlaying && mediaEl.paused && !mediaEl.ended) {
    mediaEl.play().catch(()=>{});
  }
}, 1000);
mediaEl.addEventListener('seeking', resetFade);
mediaEl.addEventListener('seeked', ()=>{
  resetFade();
  if (isHost) writeState();
});

function triggerEndFade(){
  clearTimeout(fadeTimeoutId);
  fadeTimeoutId = setTimeout(() => {
    // проверяем именно paused, а не ended: у зрителя видео останавливается
    // синхронизацией (isPlaying:false), а не собственным ended — см.
    // applyRemoteState()
    if (mediaEl.paused) {
      mediaEl.classList.add('faded-out');
    }
  }, 2500);
}
mediaEl.addEventListener('ended', triggerEndFade);

function nextTrack(){ current=(current+1)%tracks.length; loadTrack(); renderQueue(); play(); }
function prevTrack(){ current=(current-1+tracks.length)%tracks.length; loadTrack(); renderQueue(); play(); }

volSlider.addEventListener('input', ()=>{
  localVolume = parseFloat(volSlider.value);
  mediaEl.volume = localVolume;
  if (isHost) writeState();
});

// локальный мьют — только на этом устройстве, в базу не пишется и на
// зрителей никак не влияет (нужен ведущему, чтобы не слышать звук из
// браузера вдвойне поверх звука из майнаf)
localMuteBtn.addEventListener('click', () => {
  mediaEl.muted = !mediaEl.muted;
  localMuteBtn.textContent = mediaEl.muted ? '🔇' : '🔈';
});

playBtn.addEventListener('click', ()=>{ mediaEl.paused ? play() : pause(); });
document.getElementById('nextBtn').addEventListener('click', nextTrack);
document.getElementById('prevBtn').addEventListener('click', prevTrack);

queueToggle.addEventListener('click', ()=>{
  queuePanel.classList.add('open');
  queueOverlay.classList.add('open');
  queueToggle.classList.add('hidden');
});
function closeQueue(){
  queuePanel.classList.remove('open');
  queueOverlay.classList.remove('open');
  queueToggle.classList.remove('hidden');
}
document.getElementById('queueClose').addEventListener('click', closeQueue);
document.getElementById('queueOverlay').addEventListener('click', closeQueue);
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeQueue(); });

document.getElementById('seek').addEventListener('click', e=>{
  if(!mediaEl.duration) return;
  const r = e.currentTarget.getBoundingClientRect();
  mediaEl.currentTime = ((e.clientX-r.left)/r.width) * mediaEl.duration;
});

document.getElementById('hideBtn').addEventListener('click', ()=>{
  document.body.classList.add('ui-hidden');
});
document.getElementById('uiShow').addEventListener('click', ()=>{
  document.body.classList.remove('ui-hidden');
});
document.addEventListener('keydown', e=>{
  if (isHost && e.key.toLowerCase()==='h') document.body.classList.toggle('ui-hidden');
});

// Клик по сцене: у ведущего — play/pause, у зрителя — только "разлочка"
// автовоспроизведения со звуком (браузер требует жест пользователя).
document.getElementById('stage').addEventListener('click', () => {
  if (isHost) {
    mediaEl.paused ? play() : pause();
  } else if (lastKnownState && lastKnownState.isPlaying && mediaEl.paused) {
    mediaEl.play().catch(()=>{});
  }
});

/* ============ синхронизация ============ */

function writeState(){
  if (!isHost) return;
  update(stateRef, {
    track: current,
    isPlaying: !mediaEl.paused,
    position: mediaEl.currentTime || 0,
    volume: localVolume,
    updatedAt: serverTimestamp()
  });
}

function expectedPosition(state){
  if (!state) return 0;
  if (!state.isPlaying) return state.position || 0;
  const elapsedSec = (nowServer() - (state.updatedAt || nowServer())) / 1000;
  return (state.position || 0) + Math.max(0, elapsedSec);
}

const DRIFT_THRESHOLD = 1.2; // секунд — правим позицию только если разошлись сильнее

function applyRemoteState(state){
  if (!state) return;

  if (state.track !== current && tracks[state.track]) {
    current = state.track;
    loadTrack();
    renderQueue();
  }

  const target = expectedPosition(state);
  if (Math.abs(mediaEl.currentTime - target) > DRIFT_THRESHOLD) {
    mediaEl.currentTime = target;
  }

  if (state.isPlaying && mediaEl.paused) {
    mediaEl.play().catch(()=>{});
  } else if (!state.isPlaying && !mediaEl.paused) {
    mediaEl.pause();
  }

  if (typeof state.volume === 'number' && Math.abs(mediaEl.volume - state.volume) > 0.001) {
    mediaEl.volume = state.volume;
    localVolume = state.volume;
    volSlider.value = state.volume;
  }

  if (!state.isPlaying && mediaEl.duration && target >= mediaEl.duration - 0.5) {
    triggerEndFade();
  }
}

onValue(stateRef, snapshot => {
  const state = snapshot.val();
  lastKnownState = state;
  // самый первый снапшот применяем всегда (в т.ч. ведущему — чтобы при
  // перезагрузке страницы концерт не сбрасывался на первый трек)
  if (!isHost || !initializedFromRemote) {
    applyRemoteState(state);
  }
  initializedFromRemote = true;
});

// доп. досверка раз в 5 секунд — страхует от накопленного дрейфа,
// если по какой-то причине не пришло промежуточное обновление
setInterval(() => {
  if (!isHost && lastKnownState) applyRemoteState(lastKnownState);
}, 5000);

/* ============ вход как ведущий ============ */

function tryLogin(){
  const pass = hostPassInput.value;
  if (!pass) return;
  signInWithEmailAndPassword(auth, HOST_EMAIL, pass)
    .then(() => {
      hostPassInput.value = '';
      hostUnlockBox.classList.remove('open');
    })
    .catch(() => {
      hostPassInput.classList.add('err');
      setTimeout(()=>hostPassInput.classList.remove('err'), 300);
    });
}

hostUnlockBtn.addEventListener('click', () => {
  hostUnlockBox.classList.toggle('open');
  if (hostUnlockBox.classList.contains('open')) hostPassInput.focus();
});
hostPassInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') tryLogin();
});

onAuthStateChanged(auth, user => {
  isHost = !!user;
  document.body.classList.toggle('guest-mode', !isHost);
});

loadTrack();
renderQueue();
</script>
</body>
</html>
